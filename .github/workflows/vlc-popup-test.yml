name: VLC Popup Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/audio-to-popup-test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Locate Android SDK on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -x "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"
      - name: Configure Android SDK
        run: |
          printf 'sdk.dir=%s\nandroid.ndkFullVersion=21.4.7075529\n' "$ANDROID_HOME" > local.properties
      - name: Prepare optional native library project directory
        run: |
          # Upstream does not commit the generated libvlcjni/libvlc project.
          # Debug builds resolve the prebuilt LibVLC artifact instead.
          mkdir -p libvlcjni/libvlc
      - name: Build debug APK
        run: gradle :application:app:assembleDebug --stacktrace --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-popup-test-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
