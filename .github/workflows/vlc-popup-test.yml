name: VLC Popup Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/audio-to-popup-test
      - feature/play-from-start-as-audio

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Locate Android SDK on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -x "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"
      - name: Configure Android SDK
        run: |
          printf 'sdk.dir=%s\nandroid.ndkFullVersion=21.4.7075529\n' "$ANDROID_HOME" > local.properties
      - name: Prepare optional native library project directory
        run: |
          # Upstream does not commit the generated libvlcjni/libvlc project.
          # Debug builds resolve the prebuilt LibVLC artifact instead.
          mkdir -p libvlcjni/libvlc
      - name: Verify persistent signing secrets
        env:
          VLC_KEYSTORE_B64: ${{ secrets.VLC_KEYSTORE_B64 }}
          VLC_KEYSTORE_PASSWORD: ${{ secrets.VLC_KEYSTORE_PASSWORD }}
          VLC_KEY_ALIAS: ${{ secrets.VLC_KEY_ALIAS }}
        run: |
          test -n "$VLC_KEYSTORE_B64" || { echo "::error::Missing VLC_KEYSTORE_B64 secret"; exit 1; }
          test -n "$VLC_KEYSTORE_PASSWORD" || { echo "::error::Missing VLC_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$VLC_KEY_ALIAS" || { echo "::error::Missing VLC_KEY_ALIAS secret"; exit 1; }
      - name: Restore signing keystore
        env:
          VLC_KEYSTORE_B64: ${{ secrets.VLC_KEYSTORE_B64 }}
        run: |
          printf '%s' "$VLC_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vlc-signing.jks"
          chmod 600 "$RUNNER_TEMP/vlc-signing.jks"
      - name: Build signed updateable APK
        env:
          PASSWORD_KEYSTORE: ${{ secrets.VLC_KEYSTORE_PASSWORD }}
          VLC_CI_KEYSTORE_PATH: ${{ runner.temp }}/vlc-signing.jks
          VLC_CI_VERSION_CODE: ${{ github.run_number }}
          VLC_KEY_ALIAS: ${{ secrets.VLC_KEY_ALIAS }}
        run: |
          # Base code is larger than the previous 3070200 build.
          export VLC_CI_VERSION_CODE=$((3070200 + VLC_CI_VERSION_CODE))
          gradle :application:app:assembleDebug --stacktrace --no-daemon \
            -PkeyStoreFile="$VLC_CI_KEYSTORE_PATH" \
            -Pstorealias="$VLC_KEY_ALIAS"
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vlc-signing.jks"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-popup-test-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
