name: VLC Popup Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/audio-to-popup-test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"
      - name: Configure Android SDK
        run: |
          printf 'sdk.dir=%s\nandroid.ndkFullVersion=21.4.7075529\n' "$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :application:app:assembleDebug --stacktrace --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-popup-test-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
